# Generator config
output_dir: "{{ project('generated_named_paths').dags_path }}"
template_config:
  - template: ./json_dag.py.jinja2

# Endpoint config
url: "https://api.dataplatform.knmi.nl/edr/v1/collections/daily-in-situ-meteorological-observations/cube"

# Secrets config
secrets_env_file: "knmi.env"  
secrets_env_key: "KNMI_API_KEY_EDR"

# Template and object config
type: dag
objects:
  - extends: 90_models/extends/knmi_dag.yml
    knmi_parameter: EV24
  - extends: 90_models/extends/knmi_dag.yml
    knmi_parameter: RH
    