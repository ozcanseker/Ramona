# Generator config
output_dir: "./{{ project('generated_named_paths').sql_output_dir }}/"
template_config:
  - template: ./tables/bronze.sql.jinja2

# Table config
type: table
layer: RAW
schema: KNMI
json_table:
  columns:
    - id: raw_json
      datatype: JSON
      not_null: True

objects:
  - id: EV24-table
    table_name: Referentie_gewas_verdamping
    description: "Referentiegewasverdamping (Makkink) (in 0.1 mm)"
    columns: {{ scope("json_table").columns }}
        

  - id: RH-table
    table_name: Etmaalsom_neerslag
    description: "Etmaalsom van de neerslag (in 0.1 mm) (-1 voor <0.05 mm)"
    columns: {{ scope("json_table").columns }}


    